<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vintage Notebook</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="book">
        <div class="page left">
            <img src="unauthorised/image.png" alt="Notebook sketch" class="note-image"/>
            <p class="note-text">A mysterious diagram tucked inside a worn journal.</p>
        </div>
        <div class="page right">
            <h1>Welcome Adventurer</h1>
            <p>Select a symbol to begin your journey.</p>
            <div class="symbols">
                <img src="unauthorised/unauthorised.png" alt="Symbol 1"/>
                <img src="unauthorised/unauthorised.png" alt="Symbol 2"/>
                <img src="unauthorised/unauthorised.png" alt="Symbol 3"/>
            </div>
        </div>
    </div>
</body>
</html>
